<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="display-row">
            <input type="text" id="display" readonly>
            <button id="history-btn" class="history-btn" onclick="toggleHistory()" title="History">🕘</button>
        </div>

        <!-- History panel -->
        <div id="history-panel" class="history-panel hidden">
            <div class="history-header">
                <span>History</span>
                <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
            </div>
            <ul id="history-list"></ul>
        </div>

        <!-- More / Scientific panel -->
        <div id="sci-panel" class="sci-panel hidden">
            <div class="sci-grid">
                <button class="sci" onclick="appendValue('Math.sin(')">sin</button>
                <button class="sci" onclick="appendValue('Math.cos(')">cos</button>
                <button class="sci" onclick="appendValue('Math.tan(')">tan</button>
                <button class="sci" onclick="appendValue('Math.log(')">log</button>
                <button class="sci" onclick="appendValue('Math.log2(')">log₂</button>
                <button class="sci" onclick="appendValue('Math.sqrt(')">√</button>
                <button class="sci" onclick="appendValue('Math.cbrt(')">∛</button>
                <button class="sci" onclick="appendValue('Math.pow(')">xʸ</button>
                <button class="sci" onclick="appendValue('Math.PI')">π</button>
                <button class="sci" onclick="appendValue('Math.E')">e</button>
                <button class="sci" onclick="appendValue('Math.abs(')">|x|</button>
                <button class="sci" onclick="appendValue('Math.floor(')">⌊x⌋</button>
            </div>
        </div>

        <!-- More toggle -->
        <button id="more-btn" class="more-btn" onclick="toggleSci()">more</button>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')" class="zero">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
